<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calculadora ET403</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Calculadora ET403 · Semana 9</h1>
    <p class="intro">Calculadora con operaciones básicas y conversor de unidades (m ↔ cm, kg ↔ g).</p>

    <!-- Sección 1: calculadora (operaciones de la semana 7 + restar y multiplicar) -->
    <section class="tarjeta" aria-labelledby="titulo-calculadora">
      <h2 id="titulo-calculadora">1. Calculadora</h2>
      <div class="fila">
        <div class="campo">
          <label for="a">Primer valor</label>
          <input id="a" type="text" value="12" autocomplete="off" inputmode="decimal">
        </div>
        <div class="campo">
          <label for="operacion">Operación</label>
          <select id="operacion">
            <option value="sumar">Sumar (+)</option>
            <option value="restar">Restar (−)</option>
            <option value="multiplicar">Multiplicar (×)</option>
            <option value="dividir">Dividir (÷)</option>
          </select>
        </div>
        <div class="campo">
          <label for="b">Segundo valor</label>
          <input id="b" type="text" value="3" autocomplete="off" inputmode="decimal">
        </div>
      </div>
      <button id="calcular" type="button">Calcular</button>
      <p id="resultado" class="pantalla" role="status" aria-live="polite">Pulse Calcular para probar.</p>
    </section>

    <!-- Sección 2: conversor de unidades (zona de integración de conversor.html) -->
    <section class="tarjeta" aria-labelledby="titulo-conversor">
      <h2 id="titulo-conversor">2. Conversor de unidades</h2>
      <div class="fila">
        <div class="campo">
          <label for="conversor-valor">Valor a convertir</label>
          <input id="conversor-valor" type="text" value="1" autocomplete="off" inputmode="decimal">
        </div>
        <div class="campo">
          <label for="conversor-tipo">Conversión</label>
          <select id="conversor-tipo"></select>
        </div>
      </div>
      <button id="convertir" type="button">Convertir</button>
      <p id="conversor-resultado" class="pantalla" role="status" aria-live="polite">Pulse Convertir para probar.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
